name: Deploy GCLI prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp GCLI_OnlineFirst_Design_Prototype.html _site/index.html
          cp analytics.js _site/analytics.js
          cp -R Images _site/Images
          mkdir -p _site/board
          cp board/index.html _site/board/index.html
          mkdir -p _site/membership
          cp membership/index.html _site/membership/index.html
          mkdir -p _site/privacy
          cp privacy/index.html _site/privacy/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
